global:
  resolve_timeout: 5m
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@monitoring.example.test
  smtp_require_tls: false

# Message templates (email and Slack, ZIB TechSquare brand): alertmanager/templates/zib.tmpl
templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: team
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    # Alerts with no action to take go nowhere. In production send them to a heartbeat service
    # (healthchecks.io style) instead, so a silence from it means alerting itself is broken.
    - matchers: [alertname="Watchdog"]
      receiver: blackhole
      repeat_interval: 5m
    - matchers: [severity="critical"]
      receiver: team

receivers:
  - name: blackhole
  # One receiver, several channels. The Mailpit email is always on, so a local copy exists.
  # `python3 scripts/alerting.py` adds your real SMTP server and Slack at the two markers
  # (from .env) in a local copy of this file; this committed file works on its own.
  - name: team
    email_configs:
      - to: oncall@example.test
        send_resolved: true
        html: '{{ template "zib.email.html" . }}'
        text: '{{ template "zib.email.text" . }}'
        headers:
          subject: '{{ template "zib.subject" . }}'
      # @@EXTRA_EMAIL@@
    # @@SLACK@@

inhibit_rules:
  # If a service is down, do not also page for its errors and latency.
  - source_matchers: [alertname="TargetDown"]
    target_matchers: [alertname=~"HighErrorRate|HighLatencyP95"]
    equal: [job]
