global:
  resolve_timeout: 5m
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@monitoring.example.test
  smtp_require_tls: false

route:
  receiver: team-email
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    # Alerts with no action to take go nowhere. In production send them to a heartbeat service
    # (healthchecks.io style) instead, so a silence from it means alerting itself is broken.
    - matchers: [alertname="Watchdog"]
      receiver: blackhole
      repeat_interval: 5m
    - matchers: [severity="critical"]
      receiver: team-email
      # To page through Slack as well, define the receiver below and add: continue: true
      # and a second route to the "slack" receiver.

receivers:
  - name: blackhole
  - name: team-email
    email_configs:
      - to: oncall@example.test
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
  # Slack, once you have a webhook. Keep the URL in a file, never in this one:
  #   - name: slack
  #     slack_configs:
  #       - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
  #         channel: "#alerts"
  #         send_resolved: true
  #         title: '{{ .CommonLabels.alertname }}'
  #         text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # If a service is down, do not also page for its errors and latency.
  - source_matchers: [alertname="TargetDown"]
    target_matchers: [alertname=~"HighErrorRate|HighLatencyP95"]
    equal: [job]
